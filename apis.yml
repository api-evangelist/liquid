aid: liquid
name: Liquid
description: 'Liquid (liquid.trade, formerly tryliquid.xyz) is a perpetual-futures trading platform and
  perp-DEX aggregator that lets retail traders go long or short on 500+ markets — crypto perps, US and
  international equities, commodities, FX, indices, pre-IPO names such as OpenAI, Anthropic and SpaceX,
  and event/prediction contracts — 24/7 with up to 50x multipliers, routing orders through venues including
  Hyperliquid while keeping funds in the user''s own non-custodial wallet. Its programmable surface is
  Co-Invest, a published remote Model Context Protocol (MCP) server at coinvest.liquid.trade that puts
  market research, portfolio state and confirmed trade execution inside Claude, ChatGPT, Cursor and any
  MCP-compatible client, secured with OAuth 2.1 (PKCE + dynamic client registration) and two scopes, read
  and trade. Liquid raised an $18M Series Seed led by Neo and Left Lane Capital in April 2026, following
  a $7.6M seed led by Paradigm.'
