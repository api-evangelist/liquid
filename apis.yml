apis:
- aid: liquid:co-invest-mcp
  name: Liquid Co-Invest MCP
  description: 'Co-Invest is Liquid delivered as a remote Model Context Protocol (MCP) server. Once connected,
    an MCP client can research markets (live prices, funding rates, open interest, whale positioning, liquidation
    maps, news, leaderboards, prediction markets), read the connected account''s portfolio, orders and
    balances, and propose real trades on the user''s Liquid account. Every state-changing action renders
    a confirmation card that the human must tap before an order is sent. Authorization is OAuth 2.1 with
    PKCE and dynamic client registration, scoped read and trade; the connection can never withdraw or transfer
    funds. A paper-trading mode runs a simulated $10,000 balance against live market data.'
  humanURL: https://www.liquid.trade/coinvest-docs
  baseURL: https://coinvest.liquid.trade/mcp
