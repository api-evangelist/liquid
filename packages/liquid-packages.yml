notes: >-
  Registries probed on 2026-07-19: npm, PyPI, RubyGems, Packagist, crates.io, pkg.go.dev, NuGet and
  Maven Central. Liquid ships NO first-party client SDK in any language — its only programmable surface
  is the OAuth-protected Co-Invest MCP server, which clients reach over HTTP with no vendor library.
  The one first-party npm entry is a name reservation with no published code (version 0.0.0). Because
  there is no real client library, NO `SDKs` pointer is emitted in apis.yml — emitting one would be
  fabrication.
