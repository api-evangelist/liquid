generated: '2026-07-19'
method: searched
source: https://www.liquid.trade/coinvest-docs
notes: >-
  Liquid's sandbox is not a separate test host or a test-key prefix — it is a per-account paper-trading
  mode toggled in conversation through the Co-Invest MCP server. There is no separate sandbox base URL
  and no published test credentials, cards or fixture values; everything below is stated verbatim in the
  provider's Co-Invest documentation. Nothing here is invented.
modes:
- name: live
  default: true
  description: Real orders against the user's funded, non-custodial Liquid account.
- name: paper
  default: false
  description: Simulated trading mode. The account flips to a simulated balance of $10,000 running against
    live market data — real prices, fake money.
  starting_balance: '$10000'
  market_data: live
  how_to_enable: Tell the assistant to switch to paper mode.
  how_to_disable: Say "go back to live trading".
  reset: The paper account can be reset back to its starting balance on request.
  status_check: Paper status can be asked for at any time.
  persistence: The setting sticks between conversations until changed.
  labeling: While paper mode is on, the assistant explicitly labels everything as simulated.
test_values:
  published: false
  note: Liquid publishes no magic test symbols, test cards, test bank accounts or fixture tokens. Paper
    mode runs against the real market catalog.
separation:
  key_prefixes: none published
  separate_host: false
  note: The same OAuth-protected MCP endpoint (https://coinvest.liquid.trade/mcp) serves both live and
    paper mode; the mode is account state, not a different credential or environment.
constraints_that_apply_in_both_modes:
  minimum_collateral_per_order: '$15'
  leverage_scaling: Minimum position size scales with the multiplier — $15 of collateral at 5x is a $75
    position, at 10x a $150 position.
  rejected_proposals: A stop-loss at or past the liquidation price is rejected rather than placed.
